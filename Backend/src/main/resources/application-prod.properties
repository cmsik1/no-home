# Production infrastructure and security are fail-closed. The environment post-processor
# validates the raw variable contract before DataSource and authentication beans are created.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:0}

auth.jwt.secret=${JWT_SECRET:}

# Require an explicit secure-cookie decision in every production environment.
auth.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

# Public deployments must opt in explicitly before exposing account recovery or external-data operations.
app.features.password-reset-enabled=${PASSWORD_RESET_ENABLED:false}
app.features.member-search-enabled=${MEMBER_SEARCH_ENABLED:false}
app.features.public-data-live-search-enabled=${PUBLIC_DATA_LIVE_SEARCH_ENABLED:false}
app.features.public-data-manual-import-enabled=${PUBLIC_DATA_MANUAL_IMPORT_ENABLED:false}
